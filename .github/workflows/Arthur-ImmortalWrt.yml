name: Arthur-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/immortalwrt.git
      repo_branch: openwrt-25.12
      config_file: configs/Arthur.config
      general_config_file: configs/Arthur-General.config
      diy_script: scripts/Arthur-script.sh
      lan_ip: 192.168.233.1
      firmware_tag: Arthur
      kernel_file: kernel-6.12
      artifact_prefix: Arthur
      manifest_file: immortalwrt-qualcommax-ipq60xx.manifest
      release_summary: >-
        京东云亚瑟 RE-SS-01 专用，512MiB 内存，6.12 稳定内核及 NSS 12.5。
        内置 Docker/Compose、磁盘管理、L2TPv2/NSS、WireGuard、ZeroTier、Tailscale、
        AdGuard Home、DDNS/DDNS-Go、FRP、WOL+、PassWall（Xray/Sing-box/Hysteria2/TUIC）；
        完整包列表以 config 与 manifest 为准。默认管理地址 192.168.233.1。
